name: GlobalFarm
description: "Global Farm - The Agriculture Short Videos Shopping"
publish_to: 'none'
version: 1.0.0+3
environment:
  sdk: ^3.9.2
dependencies:
  cached_network_image: ^3.3.0
  camerawesome: ^2.0.2
  chewie: ^1.7.5
  cupertino_icons: ^1.0.8
  dio: ^5.4.0
  firebase_auth: ^6.4.0
  firebase_core: ^4.7.0
  flutter:
    sdk: flutter
  flutter_dotenv: ^5.2.1
  flutter_local_notifications: ^17.2.3
  flutter_secure_storage: ^9.0.0
  http: ^1.2.2
  crypto: ^3.0.6
  flutter_spinkit: ^5.2.2
  flutter_staggered_grid_view: ^0.7.0
  geocoding: ^4.0.0
  geolocator: ^10.1.0
  get: ^4.6.6
  google_fonts: ^6.1.0
  google_mlkit_translation: ^0.14.0
  google_sign_in: ^7.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  iconsax: ^0.0.8
  image_picker: ^1.0.4
  intl: ^0.20.2
  lottie: ^2.7.0
  mobile_scanner: ^7.2.0
  onesignal_flutter: ^5.0.4
  package_info_plus: ^9.0.0
  path_provider: ^2.1.1
  permission_handler: ^11.1.0
  provider: ^6.1.1
  restart_app: ^1.3.2
  sadad_qa_payments: ^1.0.2
  share_plus: ^7.2.2
  shared_preferences: ^2.2.2
  sign_in_with_apple: ^6.1.4
  shimmer: ^3.0.0
  shorebird_code_push: ^2.0.5
  terminate_restart: ^1.0.11
  url_launcher: ^6.2.2
  uuid: ^4.2.1
  video_player: ^2.8.1
  video_thumbnail: ^0.5.3
  webview_flutter: ^4.13.1
  awesome_dialog: ^3.3.0
  awesome_snackbar_content: ^0.1.8
  in_app_review: ^2.0.12

dev_dependencies:
  build_runner: ^2.4.7
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/images/Logo.png
    - assets/animations/
    - assets/images/social/
    - lib/l10n/
    - shorebird.yaml
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito/Nunito-ExtraBold.ttf
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal/Tajawal-ExtraBold.ttf
